name: VersionFox CI

on: [push, pull_request, workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
      - name: Setup Go from go.mod
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install dependencies
        run: |
          go get .
      - name: Build
        run: |
          go build .
      - name: Test and coverage
        env:
          # The CLI tests in cmd/commands run on Windows as well. There, selecting
          # an SDK globally writes the PATH that the registry holds for the user,
          # so they only run where that may happen: a runner that is thrown away.
          VFOX_TEST_WINDOWS_REGISTRY: '1'
        run: |
          go test ./... -coverprofile=coverage.out -covermode=atomic
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7

  windows-regressions:
    name: Windows shell and interrupted installation regressions
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MSYS
          install: zsh
      - name: Exercise native Windows processes and MSYS2 zsh
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
          VFOX_TEST_MSYS_ZSH: '1'
        run: |
          $env:PATH = "$env:MSYS2_LOCATION\usr\bin;$env:PATH"
          go test ./internal/env -run 'TestWindowsPathFormatByShell|TestMSYSZshPATH' -count=1 -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./internal/shell -run TestOpenSkipsVfoxShim -count=1 -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./internal/sdk -run '^TestInstall' -count=1 -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Activate vfox in PowerShell with a non-ASCII PATH
        shell: pwsh
        env:
          # The test changes nothing in the registry, but its fixture selects SDKs
          # like the build job does, so it needs the same runner.
          VFOX_TEST_WINDOWS_REGISTRY: '1'
        run: |
          go test ./cmd/commands -run '^TestPowerShellSessionKeepsNonASCIIPath$' -count=1 -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  nushell:
    name: Nushell integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # A release and the digest of its archive, so that this job tests the vfox
      # change and not whatever Nushell published last. Bump them together: the
      # digest is listed with the archive on the release page.
      NU_VERSION: 0.117.0
      NU_SHA256: 33b907da92b0e80bd10fea9fa0e8a1624cabfebd89ee2568e365da3c492ffc68
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install Nushell
        run: |
          archive="nu-${NU_VERSION}-x86_64-unknown-linux-gnu"
          curl --fail --silent --show-error --location --retry 3 \
            --output "${RUNNER_TEMP}/nu.tar.gz" \
            "https://github.com/nushell/nushell/releases/download/${NU_VERSION}/${archive}.tar.gz"
          echo "${NU_SHA256}  ${RUNNER_TEMP}/nu.tar.gz" | sha256sum --check --strict -
          mkdir "${RUNNER_TEMP}/nu"
          tar --extract --gzip --file "${RUNNER_TEMP}/nu.tar.gz" --directory "${RUNNER_TEMP}/nu"
          echo "${RUNNER_TEMP}/nu/${archive}" >> "${GITHUB_PATH}"
      - name: Exercise a native Nushell session
        env:
          # Without it a Nushell that failed to install would skip the test.
          VFOX_TEST_NUSHELL: '1'
        run: |
          nu --version
          go test ./cmd/commands -run '^TestNushell' -count=1 -v

  fish-completion:
    name: Fish completion integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install Fish
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fish
      - name: Exercise native Fish completions
        run: |
          command -v fish
          fish --version
          go test ./cmd -run '^TestFishCompletion$' -count=1 -v
