name: VersionFox CI

on: [push, pull_request, workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'version-fox/vfox'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
      - name: Setup Go from go.mod
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install dependencies
        run: |
          go get .
      - name: Build
        run: |
          go build .
      - name: Test and coverage
        env:
          # The CLI tests in cmd/commands run on Windows as well. There, selecting
          # an SDK globally writes the PATH that the registry holds for the user,
          # so they only run where that may happen: a runner that is thrown away.
          VFOX_TEST_WINDOWS_REGISTRY: '1'
        run: |
          go test ./... -coverprofile=coverage.out -covermode=atomic
      - name: Test install.sh
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/install-test.sh
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7

  windows-regressions:
    if: github.repository == 'version-fox/vfox'
    name: Windows shell and interrupted installation regressions
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MSYS
          install: zsh
      - name: Exercise native Windows processes and MSYS2 zsh
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
          VFOX_TEST_MSYS_ZSH: '1'
        run: |
          $env:PATH = "$env:MSYS2_LOCATION\usr\bin;$env:PATH"
          go test ./internal/env -run 'TestWindowsPathFormatByShell|TestMSYSZshPATH' -count=1 -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./internal/shell -run TestOpenSkipsVfoxShim -count=1 -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./internal/sdk -run '^TestInstall' -count=1 -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  nushell:
    if: github.repository == 'version-fox/vfox'
    name: Nushell integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # A release and the digest of its archive, so that this job tests the vfox
      # change and not whatever Nushell published last. Bump them together: the
      # digest is listed with the archive on the release page.
      NU_VERSION: 0.117.0
      NU_SHA256: 33b907da92b0e80bd10fea9fa0e8a1624cabfebd89ee2568e365da3c492ffc68
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install Nushell
        run: |
          archive="nu-${NU_VERSION}-x86_64-unknown-linux-gnu"
          curl --fail --silent --show-error --location --retry 3 \
            --output "${RUNNER_TEMP}/nu.tar.gz" \
            "https://github.com/nushell/nushell/releases/download/${NU_VERSION}/${archive}.tar.gz"
          echo "${NU_SHA256}  ${RUNNER_TEMP}/nu.tar.gz" | sha256sum --check --strict -
          mkdir "${RUNNER_TEMP}/nu"
          tar --extract --gzip --file "${RUNNER_TEMP}/nu.tar.gz" --directory "${RUNNER_TEMP}/nu"
          echo "${RUNNER_TEMP}/nu/${archive}" >> "${GITHUB_PATH}"
      - name: Exercise a native Nushell session
        env:
          # Without it a Nushell that failed to install would skip the test.
          VFOX_TEST_NUSHELL: '1'
        run: |
          nu --version
          go test ./cmd/commands -run '^TestNushell' -count=1 -v

  fish-completion:
    if: github.repository == 'version-fox/vfox'
    name: Fish completion integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install Fish
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fish
      - name: Exercise native Fish completions
        run: |
          command -v fish
          fish --version
          go test ./cmd -run '^TestFishCompletion$' -count=1 -v

  lint:
    if: github.repository == 'version-fox/vfox'
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Releases and the digests of their linux_amd64 archives, so that this job
      # checks the code against one linter release. Bump a version and its digest
      # together (the digests are in the release's checksums file), then fix what
      # the new release reports.
      GOLANGCI_LINT_VERSION: 2.15.0
      GOLANGCI_LINT_SHA256: 9b7fe6a6bf6334b98decf8d86b11415ea7889afdabdd1959fdce23af2a9ebcea
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install golangci-lint and actionlint
        run: |
          mkdir "${RUNNER_TEMP}/bin"
          archive="golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64"
          curl --fail --silent --show-error --location --retry 3 \
            --output "${RUNNER_TEMP}/golangci-lint.tar.gz" \
            "https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_LINT_VERSION}/${archive}.tar.gz"
          echo "${GOLANGCI_LINT_SHA256}  ${RUNNER_TEMP}/golangci-lint.tar.gz" | sha256sum --check --strict -
          tar --extract --gzip --file "${RUNNER_TEMP}/golangci-lint.tar.gz" --directory "${RUNNER_TEMP}/bin" \
            --strip-components 1 "${archive}/golangci-lint"
          curl --fail --silent --show-error --location --retry 3 \
            --output "${RUNNER_TEMP}/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/actionlint.tar.gz" | sha256sum --check --strict -
          tar --extract --gzip --file "${RUNNER_TEMP}/actionlint.tar.gz" --directory "${RUNNER_TEMP}/bin" actionlint
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - name: Lint Go
        # Each GOOS builds its own files (registry, junctions and shims are Windows
        # only, PTY tests are Unix only), so each one is linted.
        run: |
          golangci-lint version
          status=0
          for goos in linux darwin windows; do
            echo "::group::GOOS=${goos}"
            GOOS="${goos}" golangci-lint run ./... || status=1
            echo "::endgroup::"
          done
          exit "${status}"
      - name: Lint workflows
        # The shell in run steps isn't linted yet: shellcheck comes with the
        # shell script linting.
        run: |
          actionlint -version
          actionlint -shellcheck= -pyflakes=

  format:
    if: github.repository == 'version-fox/vfox'
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Releases and the digests of their binaries, so that this job checks the
      # code against one formatter and not whatever its newest release prefers.
      # Bump a version and its digest together (the digest is listed with the
      # asset on the release page), then run the matching check below and commit
      # what the new release changes.
      STYLUA_VERSION: 2.6.0
      STYLUA_SHA256: a485f72bbfa22e4642e77a84b5edc2611a5cab7477b34e2e709dd8f78e919895
      SHFMT_VERSION: 3.14.1
      SHFMT_SHA256: 76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf
      FISH_VERSION: 4.9.3
      FISH_SHA256: 8f643d10ad1abb0ef7072764c01ceb5cf61b2d373fda400cf60f0bad69b7e095
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "These files are not gofmt-formatted; run gofmt -w on them:"
            echo "${unformatted}"
            exit 1
          fi
      - name: Install StyLua, shfmt and fish_indent
        run: |
          mkdir "${RUNNER_TEMP}/bin"
          curl --fail --silent --show-error --location --retry 3 \
            --output "${RUNNER_TEMP}/stylua.zip" \
            "https://github.com/JohnnyMorganz/StyLua/releases/download/v${STYLUA_VERSION}/stylua-linux-x86_64.zip"
          echo "${STYLUA_SHA256}  ${RUNNER_TEMP}/stylua.zip" | sha256sum --check --strict -
          unzip -q "${RUNNER_TEMP}/stylua.zip" -d "${RUNNER_TEMP}/bin"
          curl --fail --silent --show-error --location --retry 3 \
            --output "${RUNNER_TEMP}/bin/shfmt" \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          echo "${SHFMT_SHA256}  ${RUNNER_TEMP}/bin/shfmt" | sha256sum --check --strict -
          chmod +x "${RUNNER_TEMP}/bin/stylua" "${RUNNER_TEMP}/bin/shfmt"
          curl --fail --silent --show-error --location --retry 3 \
            --output "${RUNNER_TEMP}/fish.tar.xz" \
            "https://github.com/fish-shell/fish-shell/releases/download/${FISH_VERSION}/fish-${FISH_VERSION}-linux-x86_64.tar.xz"
          echo "${FISH_SHA256}  ${RUNNER_TEMP}/fish.tar.xz" | sha256sum --check --strict -
          tar --extract --xz --file "${RUNNER_TEMP}/fish.tar.xz" --directory "${RUNNER_TEMP}/bin" fish
          # The release only ships fish, which runs as fish_indent when it is called by that name.
          ln -s fish "${RUNNER_TEMP}/bin/fish_indent"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - name: Check Lua formatting
        run: |
          stylua --version
          stylua --check .
      - name: Check shell formatting
        run: |
          shfmt --version
          shfmt -d install.sh scripts/*.sh completions/bash_autocomplete
      - name: Check Fish formatting
        run: |
          fish_indent --version
          fish_indent --check completions/vfox.fish
