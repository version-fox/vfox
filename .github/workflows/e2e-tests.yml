name: vfox E2E Test

on:
  push:
  pull_request:
    paths:
      - 'packaging/msix/**'
      - 'scripts/e2e-msix-test.ps1'
      - 'scripts/testdata/msix-probe/**'
      - 'scripts/testdata/msix-runner/**'
      - 'cmd/commands/upgrade*'
      - '.github/workflows/e2e-tests.yml'
      - '.github/workflows/compile-msix.yml'
  workflow_dispatch:

jobs:
  test-windows:
    if: github.repository == 'version-fox/vfox'
    name: Test on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check Go installation
        run: go version

      - name: Check PowerShell version
        shell: pwsh
        run: $PSVersionTable.PSVersion

      - name: Run E2E Tests (PowerShell)
        shell: pwsh
        run: |
          cd ${{ github.workspace }}
          $ErrorActionPreference = "Stop"
          
          # Run the E2E test script
          & .\scripts\e2e-test.ps1
        env:
          VFOX_HOME: ${{ runner.temp }}\.vfox

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows
          path: ${{ runner.temp }}\.vfox

  test-msix-windows:
    if: github.repository == 'version-fox/vfox'
    name: Test MSIX packaging on Windows
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check Go installation
        run: go version
      # Build, pack, sign, install and verify the .msixbundle end-to-end
      - name: Run MSIX packaging integration tests
        shell: pwsh
        run: |
          cd ${{ github.workspace }}
          $ErrorActionPreference = "Stop"
          & .\scripts\e2e-msix-test.ps1
        env:
          VFOX_HOME: ${{ runner.temp }}\.vfox
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-msix-windows
          path: msix-e2e-out

  test-unix:
    if: github.repository == 'version-fox/vfox'
    name: Test on Unix
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check Go installation
        run: go version

      - name: Run E2E Tests (Bash)
        shell: bash
        run: |
          cd ${{ github.workspace }}
          chmod +x ./scripts/e2e-test.sh
          ./scripts/e2e-test.sh
        env:
          VFOX_HOME: ${{ runner.temp }}/.vfox

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: ${{ runner.temp }}/.vfox

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test-windows, test-unix, test-msix-windows]
    if: always() && github.repository == 'version-fox/vfox'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8

      - name: Print summary
        run: |
          echo "E2E Tests Summary"
          echo "================"
          echo "Windows tests: $(find . -maxdepth 1 -name 'test-results-windows*' | wc -l) platform(s)"
          echo "MSIX packaging tests: $(find . -maxdepth 1 -name 'test-results-msix-windows-*' | wc -l) platform(s)"
          echo "Unix tests: $(find . -maxdepth 1 -name 'test-results-*' ! -name '*windows*' | wc -l) platform(s)"
          echo ""
          echo "All test artifacts have been uploaded."

      - name: Check test results
        if: needs.test-windows.result != 'success' || needs.test-unix.result != 'success' || needs.test-msix-windows.result != 'success'
        run: |
          echo "Some tests failed. Please check the artifacts above."
          exit 1
